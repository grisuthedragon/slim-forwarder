[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slim-forwarder"
version = "0.1.0"
description = "A lightweight dynamic web proxy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.28.0",
]

[project.scripts]
slim-forwarder = "slim_forwarder.cli:main"

[project.urls]
Homepage = "https://github.com/yourorg/slim-forwarder"
Issues = "https://github.com/yourorg/slim-forwarder/issues"

[tool.setuptools.packages.find]
where = ["src"]
